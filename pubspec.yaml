name: altcast
description: "AltCast — Jellyfin movies & TV shows client."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.0.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  uuid: ^4.5.3
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  connectivity_plus: ^6.0.0
  google_fonts: ^6.2.1
  package_info_plus: ^8.0.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
