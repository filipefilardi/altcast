name: altcast
description: "AltCast — Jellyfin movies & TV shows client."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  go_router: ^17.0.0
  dio: ^5.9.2
  flutter_secure_storage: ^10.0.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  uuid: ^4.5.3
  rxdart: ^0.28.0
  path_provider: ^2.1.5
  connectivity_plus: ^7.1.1
  google_fonts: ^8.1.0
  package_info_plus: ^9.0.1
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# volume_controller 3.4.2+ uses FlutterSceneLifeCycleDelegate / addSceneDelegate,
# which require a newer Flutter engine than stable 3.32 ships in framework headers.
dependency_overrides:
  volume_controller: 3.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
