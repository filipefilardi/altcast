name: altcast
description: "A modern, open-source movies and TV shows client for Jellyfin."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  dio: ^5.11.0
  flutter_secure_storage: ^10.3.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.2
  uuid: ^4.5.3
  rxdart: ^0.28.0
  path_provider: ^2.1.6
  connectivity_plus: ^7.3.1
  background_downloader: ^9.5.7
  google_fonts: ^8.1.0
  package_info_plus: ^10.2.1
  device_info_plus: ^13.2.0
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5
  screen_brightness: ^2.1.11
  web_socket_channel: ^3.0.3
  picons: ^3.0.1
  flutter_local_notifications: ^22.2.0
  workmanager: ^0.9.0+3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  
flutter_launcher_icons:
  android: false
  ios: true
  image_path: assets/icons/app_icon.png
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: assets/icons/app_icon.png

# volume_controller 3.4.2+ uses FlutterSceneLifeCycleDelegate / addSceneDelegate,
# which require a newer Flutter engine than stable 3.32 ships in framework headers.
dependency_overrides:
  volume_controller: 3.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
