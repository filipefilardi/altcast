name: Feature request
description: Suggest a new feature or improvement for AltCast.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion! For non-trivial features, opening an issue
        first lets us align on scope before any code is written.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is this feature trying to solve?
      placeholder: When I'm offline, I can't easily see which albums I've downloaded vs. which are streaming-only.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What change would you like to see?
      placeholder: Add a "downloaded" filter toggle on the library screen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about and why this one is better.

  - type: dropdown
    id: scope
    attributes:
      label: Affected platforms
      multiple: true
      options:
        - iOS
        - Android
        - macOS
        - All

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Mockups, links to similar features in other apps, etc.

  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I searched [existing issues](https://github.com/filipefilardi/altsound/issues) and didn't find a duplicate.
          required: true
