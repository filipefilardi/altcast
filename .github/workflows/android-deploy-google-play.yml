name: Android Deploy to Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: google-play-deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$ENCODED_KEYSTORE" | base64 -d > android/app/upload-keystore.jks

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf 'storePassword=%s\n' "$STORE_PASSWORD" > android/key.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> android/key.properties
          printf 'keyAlias=upload\n' >> android/key.properties
          printf 'storeFile=upload-keystore.jks\n' >> android/key.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Compute semantic version
        id: version
        run: |
          LAST_TAG=$(git tag --list 'v*' --sort=-v:refname | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ {print; exit}')
          if [ -z "$LAST_TAG" ]; then
            VERSION_NAME="1.0.0"
          else
            MAJOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d'.' -f1)
            MINOR=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d'.' -f2)
            PATCH=$(echo "$LAST_TAG" | sed 's/^v//' | cut -d'.' -f3)
            VERSION_NAME="${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          BUILD_NUMBER=${{ github.run_number }}
          echo "name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "full=${VERSION_NAME}+${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME}+${BUILD_NUMBER}"

      - name: Build release AAB
        run: flutter build appbundle --release --build-name=${{ steps.version.outputs.name }} --build-number=${{ steps.version.outputs.build }}

      - uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: v${{ steps.version.outputs.full }}
          files: build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-bundle

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.silent_summit.altsound
          releaseFiles: app-release.aab
          tracks: internal
          status: draft
